<html lang="cs">
<head>

  <title>Jídelna | Výroba a expedice</title>
  <link rel="stylesheet" href="./food-production.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
    :root{color-scheme:light;--paper:#f3f5f1;--surface:#fff;--ink:#18211d;--muted:#78817b;--line:#e5e9e4;--green:#24765b;--green-dark:#1a5f49;--green-pale:#e8f2ed;--orange:#d67443;--orange-pale:#fbefe8;--mono:'DM Mono','Courier New',monospace;--sans:'DM Sans',sans-serif;--display:'Manrope',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}
    .sidebar{display:flex;flex-direction:column;min-height:100vh;padding:24px 15px 18px;background:#1d2924;color:#f4f7f4}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 31px}.brand-mark{display:grid;width:34px;height:34px;place-items:center;border-radius:9px 9px 9px 3px;background:#8bc6a5;color:#1d2924;font-family:var(--display);font-size:19px;font-weight:800}.brand-name{font-family:var(--display);font-size:16px;font-weight:800}.brand-sub{margin-top:2px;color:#9caaa2;font-size:10px}.side-label{padding:0 11px 9px;color:#839188;font-family:var(--mono);font-size:10px;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:0;border-radius:5px;background:transparent;color:#b6c0ba;text-align:left;transition:background .16s,color .16s}.nav button:hover{background:#293932;color:#fff}.nav button.active{background:#31473b;color:#fff}.nav-icon{display:grid;width:18px;place-items:center;color:#91b99f;font-size:16px}.nav-count{margin-left:auto;padding:2px 7px;border-radius:10px;background:#bd693e;color:#fff;font-family:var(--mono);font-size:10px}.side-bottom{margin-top:auto}.plant-card{margin:0 4px 17px;padding:13px;border:1px solid #39483f;border-radius:6px;background:#25332c}.plant-heading{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;font-weight:600}.live-dot{width:7px;height:7px;border-radius:50%;background:#83c59d;box-shadow:0 0 0 3px #83c59d20}.plant-meta{display:flex;justify-content:space-between;color:#a3afa7;font-size:11px}.plant-meta strong{color:#e4ece6;font-family:var(--mono);font-weight:400}.user{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid #39483f}.avatar{display:grid;width:30px;height:30px;place-items:center;border-radius:50%;background:#bf7954;color:#fff;font-size:11px;font-weight:700}.user-name{font-size:12px;font-weight:600}.user-role{margin-top:2px;color:#9caaa2;font-size:10px}
    .main{min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:0 34px;border-bottom:1px solid var(--line);background:#fbfcfa}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:17px}.shift-tag{display:inline-flex;align-items:center;gap:7px;color:#58645d;font-size:12px}.shift-tag .live-dot{width:6px;height:6px}.top-date{color:var(--muted);font-family:var(--mono);font-size:11px}.icon-button{position:relative;display:grid;width:34px;height:34px;place-items:center;border:1px solid var(--line);border-radius:5px;background:#fff;color:#59665f;font-size:16px}.icon-button:hover{border-color:#b8c9be;color:var(--green)}.notification-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border:1px solid white;border-radius:50%;background:var(--orange)}.content{width:min(1440px,100%);margin:0 auto;padding:31px 34px 48px}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{margin-bottom:7px;color:var(--green);font-family:var(--mono);font-size:10px;text-transform:uppercase}h1{margin:0;font-family:var(--display);font-size:27px;font-weight:700;line-height:1.2}.subtitle{margin:7px 0 0;color:var(--muted);font-size:12px}.button-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:37px;padding:0 13px;border:1px solid var(--green);border-radius:4px;background:var(--green);color:#fff;font-size:12px;font-weight:600;transition:background .16s,transform .16s}.button-primary:hover{transform:translateY(-1px);background:var(--green-dark)}.button-primary .plus{font-size:17px;font-weight:400}.button-secondary{min-height:32px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#46534b;font-size:11px;font-weight:600}.button-secondary:hover{border-color:#b9c9bf;color:var(--green)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}.stat{position:relative;overflow:hidden;min-height:112px;padding:17px 18px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}.stat:after{position:absolute;top:0;right:0;width:4px;height:100%;background:#dfe9e2;content:''}.stat.accent-green:after{background:#72ae8b}.stat.accent-orange:after{background:#dc966c}.stat-label{color:var(--muted);font-size:11px}.stat-value{margin-top:8px;font-family:var(--display);font-size:27px;font-weight:700;line-height:1}.stat-foot{margin-top:9px;color:#7c8981;font-size:10px}.stat-foot strong{color:var(--green)}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(275px,.85fr);gap:16px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:5px;background:var(--surface)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.panel-title{margin:0;font-family:var(--display);font-size:13px;font-weight:700}.panel-kicker{margin-top:4px;color:var(--muted);font-size:10px}.text-button{padding:4px 0;border:0;background:transparent;color:var(--green);font-size:11px;font-weight:600}.text-button:hover{color:var(--green-dark)}
    .today-list{padding:0 18px}.order-row{display:grid;grid-template-columns:68px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid #eef0ed}.order-row:last-child{border-bottom:0}.time{color:#68756d;font-family:var(--mono);font-size:11px}.row-name{overflow:hidden;font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.row-sub{margin-top:4px;color:var(--muted);font-size:10px}.status{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:3px;background:#f0f2f0;color:#637068;font-size:9px;font-weight:600;white-space:nowrap}.status:before{width:5px;height:5px;border-radius:50%;background:#98a39b;content:''}.status-running{background:var(--green-pale);color:#286b50}.status-running:before{background:#42956c}.status-waiting{background:var(--orange-pale);color:#a9522d}.status-waiting:before{background:#d67443}.status-done{background:#edf1e7;color:#687744}.status-done:before{background:#99a866}.pending-list{padding:3px 17px 12px}.pending-item{padding:13px 1px;border-bottom:1px solid #eef0ed}.pending-item:last-child{border-bottom:0}.pending-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.order-code{color:#79847d;font-family:var(--mono);font-size:10px}.pending-name{margin-top:6px;font-size:11px;font-weight:600}.pending-detail{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;color:var(--muted);font-size:10px}.confirm-button{padding:5px 8px;border:1px solid #b9d4c2;border-radius:3px;background:#f2f8f3;color:#276449;font-size:10px;font-weight:600}.confirm-button:hover{background:#e4f1e8}.empty{padding:24px 10px;color:var(--muted);font-size:12px;text-align:center}.section-gap{margin-top:17px}
    .schedule-wrap{overflow-x:auto;padding:15px}.schedule{display:grid;grid-template-columns:repeat(5,minmax(145px,1fr));min-width:790px;border:1px solid var(--line);border-right:0;border-bottom:0}.day-column{min-height:258px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.day-head{padding:11px 12px;border-bottom:1px solid var(--line);background:#fafbf9}.day-name{color:#68756d;font-family:var(--mono);font-size:10px;text-transform:uppercase}.day-date{margin-top:4px;font-family:var(--display);font-size:15px;font-weight:700}.day-load{float:right;margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:9px}.day-orders{display:grid;align-content:start;gap:7px;padding:9px}.schedule-card{padding:8px;border-left:3px solid #81b594;border-radius:2px;background:#eff6f0}.schedule-card.waiting{border-color:#d58a61;background:#fbf1eb}.schedule-card.done{border-color:#b3bd8c;background:#f2f4eb}.schedule-time{color:#69766e;font-family:var(--mono);font-size:9px}.schedule-product{overflow:hidden;margin-top:5px;font-size:10px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.schedule-meta{margin-top:4px;color:#748078;font-size:9px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.search{width:240px;height:33px;padding:0 10px;border:1px solid var(--line);border-radius:4px;outline:0;background:#fff;color:var(--ink);font-size:11px}.search:focus,.select:focus,.field input:focus,.field select:focus{border-color:#7cab8b;box-shadow:0 0 0 2px #5a9c741a;outline:0}.select{height:33px;padding:0 25px 0 9px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#59665f;font-size:11px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{padding:10px 15px;background:#fafbf9;color:#859088;font-family:var(--mono);font-size:9px;font-weight:400;text-transform:uppercase}td{padding:12px 15px;border-top:1px solid #eef0ed;color:#46534b;font-size:11px}tbody tr:hover{background:#fbfcfa}.table-code{color:var(--green);font-family:var(--mono);font-size:10px;font-weight:500}.table-product{color:var(--ink);font-weight:600}.table-action{padding:5px 8px;border:1px solid #dfe7e1;border-radius:3px;background:#fff;color:#466352;font-size:10px;font-weight:600}.table-action:hover{border-color:#a6c2af;background:#f4f8f4}
    .confirm-stack{display:grid;gap:9px;padding:15px}.confirm-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 15px;border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:4px;background:#fff}.confirm-card h3{margin:6px 0 0;font-size:12px}.confirm-card p{margin:5px 0 0;color:var(--muted);font-size:10px}.inventory-bar{display:inline-flex;align-items:center;gap:7px}.bar{overflow:hidden;width:72px;height:5px;border-radius:5px;background:#edf0ec}.bar span{display:block;height:100%;border-radius:inherit;background:#73a987}.bar.low span{background:#d58a61}.mobile-menu{display:none}
    dialog{width:min(440px,calc(100vw - 30px));padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);box-shadow:0 20px 70px #18211d30}dialog::backdrop{background:#15201a70;backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:flex-start;justify-content:space-between;padding:19px 20px 15px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-family:var(--display);font-size:17px}.dialog-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.dialog-close{width:28px;height:28px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#68756d;font-size:17px}.dialog-form{display:grid;gap:13px;padding:18px 20px 20px}.field{display:grid;gap:6px}.field label{color:#68756d;font-size:10px;font-weight:600}.field input,.field select{width:100%;height:37px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:12px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:5px}.toast{position:fixed;right:24px;bottom:23px;z-index:5;padding:11px 15px;border:1px solid #426e56;border-radius:4px;background:#1d3328;color:#fff;font-size:12px;box-shadow:0 8px 25px #1d292426;animation:toast-in .2s ease-out}@keyframes toast-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:1000px){.shell{grid-template-columns:205px minmax(0,1fr)}.content{padding-right:22px;padding-left:22px}.topbar{padding:0 22px}.dashboard-grid{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:700px){.shell{display:block}.sidebar{position:fixed;z-index:4;top:0;bottom:0;left:0;width:250px;min-height:auto;transform:translateX(-100%);transition:transform .2s ease;box-shadow:10px 0 30px #18211d15}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid}.topbar{min-height:58px;padding:0 15px}.top-actions{gap:10px}.top-date{display:none}.content{padding:24px 15px 38px}.page-heading{align-items:flex-start;margin-bottom:19px}h1{font-size:23px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{min-height:98px;padding:13px}.stat-value{font-size:24px}.dashboard-grid{gap:12px}.toolbar{align-items:stretch;flex-direction:column}.toolbar-left,.toolbar-right{width:100%}.search{width:100%}.toolbar-right .select{flex:1}.confirm-card{grid-template-columns:minmax(0,1fr)}.confirm-card .confirm-button{justify-self:start}.order-row{grid-template-columns:50px minmax(0,1fr);gap:9px}.order-row>.status{grid-column:2;justify-self:start;margin-top:-9px;margin-bottom:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">J</div><div><div class="brand-name">jídelna<span style="color:#8bc6a5">.</span></div><div class="brand-sub">VÝROBA A EXPEDICE</div></div></div>
      <div class="side-label">Řízení výroby</div>
      <nav class="nav" aria-label="Hlavní navigace">
        <button class="active" data-view="overview"><span class="nav-icon">◫</span>Přehled</button>
        <button data-view="recipes"><span class="nav-icon">♨</span>Receptury a postupy</button>
        <button data-view="plan"><span class="nav-icon">▦</span>Plán výroby</button>
        <button data-view="orders"><span class="nav-icon">☷</span>Výrobní příkazy</button>
        <button data-view="batches"><span class="nav-icon">▧</span>Šarže a sledovatelnost</button>
        <button data-view="stock-material"><span class="nav-icon">▤</span>Sklad surovin</button>
        <button data-view="stock-production"><span class="nav-icon">▤</span>Sklad výroby</button>
        <button data-view="expedition"><span class="nav-icon">⇢</span>Expedice <span class="nav-count" id="nav-pending">0</span></button>
        <button data-view="stock-expedition"><span class="nav-icon">▤</span>Expediční sklad</button>
      </nav>
      <div class="side-bottom"><div class="plant-card"><div class="plant-heading"><span class="live-dot"></span>Provoz běží</div><div class="plant-meta"><span>Směna</span><strong>1 / 3</strong></div><div class="plant-meta" style="margin-top:7px"><span>Vytížení linek</span><strong>78 %</strong></div></div><div class="user"><div class="avatar">MN</div><div><div class="user-name">Marek Novotný</div><div class="user-role">Vedoucí výroby</div></div></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="Otevřít navigaci">☰</button><div class="crumb">Provozovna <span style="padding:0 5px;color:#b1b9b3">/</span> <strong id="crumb-title">Přehled</strong></div></div><div class="top-actions"><span class="shift-tag"><span class="live-dot"></span>Směna 1 právě probíhá</span><span class="top-date" id="top-date"></span><button class="icon-button" id="notification-button" aria-label="Čekající potvrzení" title="Čekající potvrzení">♧<span class="notification-dot"></span></button></div></header>
      <div class="content" id="app-content"></div>
    </main>
  </div>
  <dialog id="order-dialog"><div class="dialog-head"><div><h2>Nový výrobní příkaz</h2><p>Receptura automaticky přepočítá potřebu surovin.</p></div><button class="dialog-close" type="button" id="dialog-close" aria-label="Zavřít">×</button></div>
      <form class="dialog-form" id="order-form"><div class="field"><label for="product">Jídlo / receptura</label><select id="product" name="product" required><option value="svickova">Hovězí svíčková na smetaně</option><option value="gulas">Hovězí guláš</option><option value="rizoto">Kuřecí rizoto</option></select></div>
        <div class="field-grid"><div class="field"><label for="line">Kuchyně</label><select id="line" name="line"><option>Teplá kuchyně</option><option>Studená kuchyně</option><option>Přípravna</option></select></div><div class="field"><label for="quantity">Počet porcí</label><input id="quantity" name="quantity" type="number" min="1" max="5000" value="120" required></div></div>
        <div class="field-grid"><div class="field"><label for="day">Den výroby</label><select id="day" name="day"><option value="Po">Pondělí · 19. 10.</option><option value="Út">Úterý · 20. 10.</option><option value="St">Středa · 21. 10.</option><option value="Čt">Čtvrtek · 22. 10.</option><option value="Pá">Pátek · 23. 10.</option></select></div><div class="field"><label for="time">Čas expedice</label><input id="time" name="time" type="time" value="13:00" required></div></div>
        <div class="field"><label for="customer">Odběratel</label><input id="customer" name="customer" type="text" value="Školní jídelna Praha 6" required></div>
        <div class="form-actions"><button class="button-secondary" type="button" id="dialog-cancel">Zrušit</button><button class="button-primary" type="button" id="food-save-order">Naplánovat příkaz</button></div></form></dialog>
  <script>
    const initialOrders = [
      {id:'V-26041',product:'Kryt motoru K-240',line:'Linka A',day:'Po',time:'06:00',qty:240,status:'running'},
      {id:'V-26042',product:'Hřídel převodovky H-18',line:'Linka B',day:'Po',time:'07:30',qty:180,status:'waiting'},
      {id:'V-26043',product:'Montážní sada M-6',line:'Linka C',day:'Po',time:'09:00',qty:360,status:'planned'},
      {id:'V-26044',product:'Držák senzoru DS-4',line:'Linka A',day:'Út',time:'06:00',qty:500,status:'planned'},
      {id:'V-26045',product:'Kryt motoru K-240',line:'Linka B',day:'Út',time:'10:00',qty:160,status:'running'},
      {id:'V-26046',product:'Hřídel převodovky H-18',line:'Linka C',day:'St',time:'07:00',qty:220,status:'planned'},
      {id:'V-26047',product:'Montážní sada M-6',line:'Linka A',day:'St',time:'12:30',qty:400,status:'done'},
      {id:'V-26048',product:'Držák senzoru DS-4',line:'Linka B',day:'Čt',time:'06:30',qty:300,status:'planned'},
      {id:'V-26049',product:'Kryt motoru K-240',line:'Linka C',day:'Pá',time:'08:00',qty:200,status:'planned'}
    ];
    const dayInfo=[{key:'Po',date:'19'},{key:'Út',date:'20'},{key:'St',date:'21'},{key:'Čt',date:'22'},{key:'Pá',date:'23'}];
    const statusLabels={planned:'Naplánováno',running:'Probíhá',waiting:'Čeká na potvrzení',done:'Potvrzeno'};
    const statusClasses={planned:'',running:'status-running',waiting:'status-waiting',done:'status-done'};
    const viewTitles={overview:'Přehled',plan:'Plán výroby',orders:'Výrobní příkazy',confirmations:'Potvrzení výroby',stock:'Zásoby'};
    const storageKey='forge-production-orders-v1';
    let orders;
    try{const saved=JSON.parse(localStorage.getItem(storageKey));orders=Array.isArray(saved)?saved:initialOrders}catch{orders=initialOrders}
    let currentView='overview',searchTerm='',statusFilter='all',toastTimer;
    const content=document.getElementById('app-content'),dialog=document.getElementById('order-dialog');
    document.getElementById('top-date').textContent=new Intl.DateTimeFormat('cs-CZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(2026,9,19));
    function saveOrders(){try{localStorage.setItem(storageKey,JSON.stringify(orders))}catch{showToast('Změny jsou dočasné pouze v tomto okně.')}}
    function countStatus(status){return orders.filter(order=>order.status===status).length}
    function statusBadge(status){return `<span class="status ${statusClasses[status]}">${statusLabels[status]}</span>`}
    function nextAction(order){if(order.status==='planned')return['start','Zahájit'];if(order.status==='running')return['finish','Dokončit'];if(order.status==='waiting')return['confirm','Potvrdit'];return['','Hotovo']}
    function orderTable(list){const rows=list.map(order=>{const[action,label]=nextAction(order);return `<tr><td><span class="table-code">${order.id}</span></td><td><span class="table-product">${order.product}</span></td><td>${order.line}</td><td>${order.day} · ${order.time}</td><td>${order.qty.toLocaleString('cs-CZ')} ks</td><td>${statusBadge(order.status)}</td><td>${action?`<button class="table-action" data-action="${action}" data-id="${order.id}">${label}</button>`:'<span style="color:#9aa39d;font-size:10px">Uzavřeno</span>'}</td></tr>`}).join('');return `<div class="table-scroll"><table><thead><tr><th>Příkaz</th><th>Výrobek</th><th>Linka</th><th>Plán</th><th>Množství</th><th>Stav</th><th>Akce</th></tr></thead><tbody>${rows||'<tr><td colspan="7"><div class="empty">Žádné příkazy neodpovídají filtru.</div></td></tr>'}</tbody></table></div>`}
    function scheduleMarkup(){return `<div class="schedule">${dayInfo.map(day=>{const dayOrders=orders.filter(order=>order.day===day.key).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="day-column"><div class="day-head"><span class="day-load">${dayOrders.length} přík.</span><div class="day-name">${day.key}</div><div class="day-date">${day.date}. 10.</div></div><div class="day-orders">${dayOrders.map(order=>`<div class="schedule-card ${order.status==='waiting'?'waiting':order.status==='done'?'done':''}" title="${order.id} · ${order.line}"><div class="schedule-time">${order.time} · ${order.id}</div><div class="schedule-product">${order.product}</div><div class="schedule-meta">${order.line} · ${order.qty} ks</div></div>`).join('')||'<div class="empty" style="padding:18px 3px;font-size:10px">Volná kapacita</div>'}</div></div>`}).join('')}</div>`}
    function renderOverview(){const today=orders.filter(order=>order.day==='Po').sort((a,b)=>a.time.localeCompare(b.time)),waiting=orders.filter(order=>order.status==='waiting');return `<div class="stats"><article class="stat"><div class="stat-label">Příkazy tento týden</div><div class="stat-value">${orders.length}</div><div class="stat-foot"><strong>+2</strong> oproti minulému týdnu</div></article><article class="stat accent-green"><div class="stat-label">Právě ve výrobě</div><div class="stat-value">${countStatus('running')}</div><div class="stat-foot">Aktivní výrobní příkazy</div></article><article class="stat accent-orange"><div class="stat-label">Čeká na potvrzení</div><div class="stat-value">${waiting.length}</div><div class="stat-foot">Hotové výrobky k zaúčtování</div></article><article class="stat"><div class="stat-label">Dokončeno tento týden</div><div class="stat-value">${countStatus('done')}</div><div class="stat-foot">${orders.length?Math.round(countStatus('done')/orders.length*100):0} % naplánovaných příkazů</div></article></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2 class="panel-title">Dnešní výroba</h2><div class="panel-kicker">Pondělí, 19. října · Směna 1</div></div><button class="text-button" data-navigate="plan">Celý plán →</button></div><div class="today-list">${today.length?today.map(order=>`<div class="order-row"><div class="time">${order.time}</div><div><div class="row-name">${order.product}</div><div class="row-sub">${order.id} · ${order.line} · ${order.qty} ks</div></div>${statusBadge(order.status)}</div>`).join(''):'<div class="empty">Na dnešek nejsou naplánované žádné příkazy.</div>'}</div></section><section class="panel"><div class="panel-head"><div><h2 class="panel-title">K potvrzení</h2><div class="panel-kicker">Dokončené výrobní příkazy</div></div><button class="text-button" data-navigate="confirmations">Zobrazit vše →</button></div><div class="pending-list">${waiting.length?waiting.slice(0,3).map(order=>`<div class="pending-item"><div class="pending-top"><span class="order-code">${order.id}</span>${statusBadge(order.status)}</div><div class="pending-name">${order.product}</div><div class="pending-detail"><span>${order.qty} ks · ${order.line}</span><button class="confirm-button" data-action="confirm" data-id="${order.id}">Potvrdit výrobu</button></div></div>`).join(''):'<div class="empty">Všechna dokončení jsou potvrzena.</div>'}</div></section></div><section class="panel section-gap"><div class="panel-head"><div><h2 class="panel-title">Týdenní plán</h2><div class="panel-kicker">19.–23. října 2026 · Všechny výrobní linky</div></div><button class="text-button" data-navigate="plan">Otevřít plán →</button></div><div class="schedule-wrap">${scheduleMarkup()}</div></section>`}
    function toolbarMarkup(){return `<div class="toolbar"><div class="toolbar-left"><input class="search" id="order-search" type="search" placeholder="Hledat příkaz nebo výrobek…" value="${searchTerm}" aria-label="Hledat příkazy"></div><div class="toolbar-right"><select class="select" id="status-filter" aria-label="Filtrovat podle stavu"><option value="all" ${statusFilter==='all'?'selected':''}>Všechny stavy</option><option value="planned" ${statusFilter==='planned'?'selected':''}>Naplánováno</option><option value="running" ${statusFilter==='running'?'selected':''}>Probíhá</option><option value="waiting" ${statusFilter==='waiting'?'selected':''}>Čeká na potvrzení</option><option value="done" ${statusFilter==='done'?'selected':''}>Potvrzeno</option></select></div></div>`}
    function filteredOrders(){return orders.filter(order=>(statusFilter==='all'||order.status===statusFilter)&&`${order.id} ${order.product} ${order.line}`.toLocaleLowerCase('cs-CZ').includes(searchTerm.toLocaleLowerCase('cs-CZ')))}
    function renderConfirmations(){const waiting=orders.filter(order=>order.status==='waiting');return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Dokončené příkazy k potvrzení</h2><div class="panel-kicker">Potvrzením se příkaz uzavře a dokončené množství se zaúčtuje.</div></div><span class="status status-waiting">${waiting.length} čeká</span></div><div class="confirm-stack">${waiting.length?waiting.map(order=>`<article class="confirm-card"><div><span class="order-code">${order.id} · ${order.line}</span><h3>${order.product}</h3><p>${order.day} ${order.time} · plánováno ${order.qty.toLocaleString('cs-CZ')} ks</p></div><button class="confirm-button" data-action="confirm" data-id="${order.id}">Potvrdit výrobu</button></article>`).join(''):'<div class="empty">Žádné příkazy nečekají na potvrzení.</div>'}</div></section>`}
    function renderStock(){const stock=[['Ocelový polotovar 42CrMo4','MAT-042',78,'kg',120],['Hliníkový odlitek AL-240','MAT-118',340,'ks',500],['Senzorová vložka DS','MAT-203',42,'ks',80],['Montážní šroub M6 × 20','MAT-019',1260,'ks',800],['Těsnění NBR 38 mm','MAT-077',95,'ks',150]];return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Stav materiálu</h2><div class="panel-kicker">Sklad hlavní výroby · aktualizováno dnes v 08:42</div></div><button class="button-secondary" data-toast="Export zásob je připraven.">Exportovat</button></div><div class="table-scroll"><table><thead><tr><th>Materiál</th><th>Kód</th><th>Na skladě</th><th>Využití zásoby</th><th>Dostupnost</th></tr></thead><tbody>${stock.map(([name,code,qty,unit,min])=>{const ratio=Math.min(100,Math.round(qty/min*100)),low=qty<min;return `<tr><td class="table-product">${name}</td><td><span class="table-code">${code}</span></td><td>${qty.toLocaleString('cs-CZ')} ${unit}</td><td><div class="inventory-bar"><span class="bar ${low?'low':''}"><span style="width:${ratio}%"></span></span><span style="color:#758078;font-size:10px">${ratio} %</span></div></td><td>${low?'<span class="status status-waiting">Doplnit</span>':'<span class="status status-done">Dostupné</span>'}</td></tr>`}).join('')}</tbody></table></div></section>`}
    function render(){document.getElementById('crumb-title').textContent=viewTitles[currentView];document.getElementById('nav-pending').textContent=countStatus('waiting');const descriptions={overview:'Pondělí, 19. října 2026 · Přehled provozu v reálném čase',plan:'Týden 43 · 19.–23. října 2026',orders:'Správa a průběžné potvrzování výroby',confirmations:'Kontrola hotové produkce před uzavřením příkazu',stock:'Přehled dostupnosti materiálu pro výrobu'};const heading=`<div class="page-heading"><div><div class="eyebrow">Výrobní závod · hala 01</div><h1>${viewTitles[currentView]}</h1><p class="subtitle">${descriptions[currentView]}</p></div>${currentView==='stock'?'':'<button class="button-primary" data-open-order><span class="plus">+</span>Nový příkaz</button>'}</div>`;let body='';if(currentView==='overview')body=renderOverview();if(currentView==='plan')body=`<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Rozvržení výrobních příkazů</h2><div class="panel-kicker">Přehled naplánovaného vytížení podle dne a linky</div></div><button class="button-secondary" data-toast="Zobrazuje se aktuální týden.">Tento týden⌄</button></div><div class="schedule-wrap">${scheduleMarkup()}</div></section><section class="panel section-gap"><div class="panel-head"><div><h2 class="panel-title">Příkazy v plánu</h2><div class="panel-kicker">Spusťte výrobu nebo sledujte její průběh</div></div><span class="order-code">${orders.length} příkazů</span></div>${orderTable(orders)}</section>`;if(currentView==='orders')body=`<section class="panel"><div class="panel-head"><div><h2 class="panel-title">Všechny výrobní příkazy</h2><div class="panel-kicker">Postup výroby: naplánovat → zahájit → dokončit → potvrdit</div></div><span class="order-code">${orders.length} příkazů</span></div>${toolbarMarkup()}<div id="orders-table">${orderTable(filteredOrders())}</div></section>`;if(currentView==='confirmations')body=renderConfirmations();if(currentView==='stock')body=renderStock();content.innerHTML=heading+body;document.querySelectorAll('.nav button').forEach(button=>button.classList.toggle('active',button.dataset.view===currentView))}
    function showToast(message){document.querySelector('.toast')?.remove();clearTimeout(toastTimer);const toast=document.createElement('div');toast.className='toast';toast.textContent=message;document.body.append(toast);toastTimer=setTimeout(()=>toast.remove(),2800)}
    function transitionOrder(id,action){const order=orders.find(item=>item.id===id);if(!order)return;const transitions={start:['planned','running','Výroba zahájena'],finish:['running','waiting','Příkaz čeká na potvrzení'],confirm:['waiting','done','Výroba potvrzena a zaúčtována']},transition=transitions[action];if(!transition||order.status!==transition[0])return;order.status=transition[1];saveOrders();render();showToast(`${order.id}: ${transition[2]}.`)}
    document.querySelector('.nav').addEventListener('click',event=>{const button=event.target.closest('[data-view]');if(!button)return;currentView=button.dataset.view;document.getElementById('sidebar').classList.remove('open');render()});
    content.addEventListener('click',event=>{const navigate=event.target.closest('[data-navigate]');if(navigate){currentView=navigate.dataset.navigate;render();return}const action=event.target.closest('[data-action]');if(action){transitionOrder(action.dataset.id,action.dataset.action);return}if(event.target.closest('[data-open-order]')){dialog.showModal();return}const toastButton=event.target.closest('[data-toast]');if(toastButton)showToast(toastButton.dataset.toast)});
    content.addEventListener('input',event=>{if(event.target.id!=='order-search')return;searchTerm=event.target.value;const table=document.getElementById('orders-table');if(table)table.innerHTML=orderTable(filteredOrders())});
    content.addEventListener('change',event=>{if(event.target.id!=='status-filter')return;statusFilter=event.target.value;const table=document.getElementById('orders-table');if(table)table.innerHTML=orderTable(filteredOrders())});
    document.getElementById('order-form').addEventListener('submit',event=>{event.preventDefault();const form=new FormData(event.currentTarget),nextNumber=Math.max(26049,...orders.map(order=>Number(order.id.slice(2))||0))+1;orders.push({id:`V-${nextNumber}`,product:form.get('product'),line:form.get('line'),day:form.get('day'),time:form.get('time'),qty:Number(form.get('quantity')),status:'planned'});saveOrders();dialog.close();event.currentTarget.reset();currentView='plan';render();showToast(`Výrobní příkaz V-${nextNumber} byl naplánován.`)});
    document.getElementById('dialog-close').addEventListener('click',()=>dialog.close());document.getElementById('dialog-cancel').addEventListener('click',()=>dialog.close());document.getElementById('notification-button').addEventListener('click',()=>{currentView='confirmations';render()});document.getElementById('menu-toggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));render();
  </script>
  <script src="./food-production.js"></script>
</body>
